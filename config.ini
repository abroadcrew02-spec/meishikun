; meishi_extractor 設定。値を変えたら次回の実行から反映される。
; 長さの単位は pt（1mm = 2.835pt）。

[paths]
; base（このファイルのあるフォルダ）からの相対パス
input = input
output = output
done = done
error = error
logs = logs
dict = dict

[output]
; csv, xlsx のどちらか、または両方
formats = csv,xlsx
split_pdf = true
unclassified_sep = " | "
review_mark = 1

[textlayer]
; ページの非空白文字数がこれ未満で画像があれば「テキスト層なし」
min_chars = 10

[split]
img_min_area_ratio = 0.01
img_min_side_pt = 56.7
img_page_cover_ratio = 0.90
img_nested_ratio = 0.90
xy_gap_min_pt = 6.0
xy_gap_y_ratio = 1.2
xy_gap_x_ratio = 3.0
xy_relax_factor = 0.5
xy_max_depth = 8
card_min_chars = 15
card_min_signals = 2
multi_cjk_company_min = 2
multi_email_min = 3
multi_postal_min = 3
row_overlap_min = 0.5
; 名刺の内部の余白で氏名側と連絡先側に切れた断片を 1 枚に戻す判定（DESIGN.md §7.5-4）
frag_size_ratio = 0.75
frag_merged_ratio = 1.3

; 名刺の枠を画像から探す（DESIGN.md §7.8）。false にすると従来の文字の配置だけで分ける
detect_cards = true
detect_dpi = 150
; これより暗い画素を縁の線の候補にする（255 が白）
detect_threshold = 250
; 上のしきい値で縁が取り切れないページでは、この分だけ足し引きしたしきい値でも順に探して、見つけた枠を足す
; （背景や名刺の紙が真っ白でないスキャンでも、縁が拾えるようになる）。書いた順に試す。
; 空にすると、上のしきい値だけで探す。足し引きした結果が 1〜255 に入らない値は飛ばす
detect_threshold_steps = -5, -10, -20, 2
detect_line_mm = 20
; 縁の線の、この長さ（mm）未満の途切れをつなぐ。名刺どうしの間隔より短くする
; （間隔より長いと隣の名刺の縁とつながり、枠として拾えなくなる）
detect_gap_mm = 4
; 名刺の大きさ（mm）。標準は 91x55
card_short_mm_min = 40
card_short_mm_max = 70
card_long_mm_min = 75
card_long_mm_max = 105
; 枠のすぐ外（mm）の文字もその名刺に含める（縁ぎりぎりの飾り文字のはみ出し対策）
detect_margin_mm = 3
; 枠の文字のうち、枠からはみ出した文字の割合がこれ以上なら、枠が名刺からずれている疑いとして
; 「要確認」にする（確認画面では、確認してほしい枠になる）。5% なら 0.05 と書く（% は付けない）。
; 小さくすると確認してほしい枠が増え、大きくすると減る。2 にすると、この判定をしない。
; はみ出した文字が 1 つも無い枠には付かない。
; 確認画面で動かした枠では、同じ名刺の文字のうち、どの枠にも入らなかった文字も、はみ出した文字として数える
frame_out_ratio = 0.05
; 縁が取れなかった名刺に、取れた名刺の大きさの枠（横向き・縦向き）を当てはめる（DESIGN.md §7.9）
fit_cards = true
fit_edge_min_mm = 4
; 枠の 4 辺が画像の線とどれだけ重なれば採用するか（0〜1）。下げると当てはめが増え、誤りも増える
fit_min_score = 0.35

[layout]
line_overlap_min = 0.5
space_gap_ratio = 0.25
segment_gap_ratio = 2.5

[classify]
name_min_chars = 2
name_max_chars = 6
name_part_max_chars = 5
name_size_ratio = 1.25
name_space_dominance = 1.3
name_merge_gap_ratio = 4.0
; 氏名の候補が複数ある名刺で、選んだ候補の文字が、ほかの候補のうちいちばん大きいもののこの倍率以上なら、
; 「氏名の候補が複数」（NAME_MULTI_CANDIDATES）の要確認を付けない（点数もいちばん高い時だけ）。
; 1 以上を書く（1 未満は設定の誤りとして止まる）。99 にすると、この判定をしない
name_dominance_ratio = 1.5
; （試験的）漢字・かなの氏名が見つからない名刺で、ローマ字（Taro Mihon）・カタカナ（ミホン タロウ）の名前を拾う。
; 拾うのは、メールアドレスの @ の前に名前の語がある時か、文字が本文より大きい時だけ。
; 最初は false（拾わない）。true にすると拾うが、大きい文字の英語の部署名やスローガンを、氏名として拾うことがある
name_fallback = false
; 上の「文字が本文より大きい」の倍率（本文の文字の大きさの中央値に対する倍率）
name_fallback_size_ratio = 1.5
address_max_lines = 3
address_line_gap_ratio = 1.0
address_size_tolerance = 0.3
